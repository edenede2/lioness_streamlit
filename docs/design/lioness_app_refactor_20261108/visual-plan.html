<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>LIONESS ROSMAP design review</title>
<style>
/* visual-plan runtime · one page: opening, map with zoom (depth 3), blocks, decisions with option panels, Respond sheet */
:root {
  --bg: #f5f6f8; --surface: #fff; --sunk: #eceef3; --fg: #151a24; --muted: #5b6474; --line: #d9dde5;
  --accent: #2b59c3; --accent-soft: #e6ecfb;
  --ai: #6b3fb8; --ai-soft: #efe8fb; --code: #22774e; --code-soft: #e2f3e9; --ext: #1f69a3; --ext-soft: #e1eef9;
  --data: #6b5a2e; --data-soft: #f6efdc; --risk: #b3261e; --risk-soft: #fbe7e5; --warn: #9a5a00; --warn-soft: #fdf0db;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --surface: #171c25; --sunk: #1e2531; --fg: #e7eaf0; --muted: #9ba4b6; --line: #2c3444;
  --accent: #91b1ff; --accent-soft: #1d2a47;
  --ai: #c6a9f6; --ai-soft: #2a2141; --code: #82d4a7; --code-soft: #16302a; --ext: #8fc5f0; --ext-soft: #172a3b;
  --data: #e3c47e; --data-soft: #30291a; --risk: #ff8f86; --risk-soft: #3a1c1a; --warn: #f0b85c; --warn-soft: #33270f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171c25; --sunk: #1e2531; --fg: #e7eaf0; --muted: #9ba4b6; --line: #2c3444;
  --accent: #91b1ff; --accent-soft: #1d2a47;
  --ai: #c6a9f6; --ai-soft: #2a2141; --code: #82d4a7; --code-soft: #16302a; --ext: #8fc5f0; --ext-soft: #172a3b;
  --data: #e3c47e; --data-soft: #30291a; --risk: #ff8f86; --risk-soft: #3a1c1a; --warn: #f0b85c; --warn-soft: #33270f; color-scheme: dark }

* { box-sizing: border-box; }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h3 { font: 700 16px/1.3 var(--display); margin: 0 0 8px; }
h3 .tag { vertical-align: 2px; }
body { background: var(--bg); color: var(--fg); font: 16.5px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 28px 18px 120px; }
h1 { font: 800 clamp(26px, 3.6vw, 36px)/1.1 var(--display); letter-spacing: -.015em; margin: 0 0 8px; }
h1 .tag { vertical-align: middle; font-size: 12px; margin-left: 8px; }
h2.sec { font: 800 26px/1.2 var(--display); margin: 0 0 12px; }
.opening { color: var(--muted); font-size: 18px; max-width: 72ch; margin: 0 0 14px; }
.toc { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
.toc a { font: 600 14px var(--body); color: var(--fg); text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; }
.toc a:hover, .toc a:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
section.block { margin-top: 44px; scroll-margin-top: 16px; }
.sub { color: var(--muted); max-width: 76ch; margin: 0 0 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; position: relative; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.grid2 > .card:only-child { grid-column: 1 / -1; }
.lbl { font: 600 11.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.card .lbl { margin-top: 0; }
.card > h3 { padding-right: 96px; }
.card p { margin: 0 0 6px; } .card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 0; padding-left: 18px; } .card li { margin: 4px 0; }
.card img { display: block; max-width: 100%; height: auto; border-radius: 10px; margin: 0 0 10px; }
.grid2.wide { grid-template-columns: minmax(0, 1fr); }
.card iframe.design { display: block; width: 100%; height: 80vh; min-height: 520px; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin: 0 0 10px; }
.box { background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-size: 15px; min-width: 0; }
pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
code { font: 13px var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.box code, .port code, .note code { background: var(--surface); }
.exstrip { background: var(--data-soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 15px; display: grid; gap: 6px; margin-bottom: 16px; max-width: 900px; }
.exb { display: block; } .exb b { font-family: var(--mono); font-size: 12.5px; color: var(--data); margin-right: 6px; }

/* badges */
.tag { display: inline-block; font: 700 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); vertical-align: 1px; margin-right: 6px; white-space: nowrap; }
.tag.recommended, .tag.rec { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tag.keep, .tag.recovered { border-color: var(--code); background: var(--code-soft); color: var(--code); }
.tag.flag { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.tag.exists { border-color: var(--ext); background: var(--ext-soft); color: var(--ext); }
.tag.answered { border-color: var(--code); background: var(--code-soft); color: var(--code); }
a.tag { text-decoration: none; }
.tag.open, .tag.failed { border-color: var(--risk); background: var(--risk-soft); color: var(--risk); }
.tag.new, .tag.round { border-color: var(--ext); background: var(--ext-soft); color: var(--ext); }
.tag.withheld, .tag.settled { border-color: var(--muted); }

/* tables */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.deftable { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.deftable th, .deftable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.deftable th { font: 600 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
.deftable tr:last-child td { border-bottom: 0; }

/* terms */
.termflow { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.termflow .sep { align-self: center; color: var(--muted); font-weight: 700; }
.tcard { flex: 1 1 200px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; position: relative; }
.tcard > .cbtn { top: 8px; right: 8px; }
.deftable .ccol { width: 1%; white-space: nowrap; } .deftable .ccol .cbtn { position: static; }
.tcard b.tt { display: block; font: 700 15.5px var(--display); margin: 6px 0 4px; }
.tcard p { margin: 0 0 6px; } .tcard .ex { background: var(--sunk); border-radius: 8px; padding: 6px 8px; margin: 0; } .tcard .ex code { background: var(--surface); }
.term { font: 700 11px var(--mono); padding: 1px 7px; border-radius: 99px; margin-right: 6px; letter-spacing: .03em; vertical-align: 1px; }
.term.car { background: var(--data-soft); color: var(--data); } .term.cell { background: var(--ext-soft); color: var(--ext); }
.term.shape { background: var(--ai-soft); color: var(--ai); } .term.slot { background: var(--code-soft); color: var(--code); }

/* map stage */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14.5px; min-height: 32px; margin-bottom: 8px; white-space: nowrap; overflow-x: auto; scroll-margin-top: 12px; }
.crumbs button { font: 600 14.5px var(--body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 2px; }
.crumbs span { color: var(--muted); }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ov, .diag { position: relative; overflow-x: auto; }
.ov { padding: 10px; }
.ov::after, .diag::after { content: attr(data-scroll); display: none; position: sticky; left: 0; font: 600 12px var(--body); color: var(--muted); padding: 0 4px 6px; }
.ov svg { display: block; width: 100%; min-width: 720px; height: auto; }
.diag svg { display: block; width: 100%; min-width: 600px; height: auto; }
.hint { font-size: 14px; color: var(--muted); padding: 0 18px 14px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.key { display: inline-flex; gap: 6px; align-items: center; } .key i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
.key i.ai { background: var(--ai-soft); border-color: var(--ai); } .key i.code { background: var(--code-soft); border-color: var(--code); }
.key i.ext { background: var(--ext-soft); border-color: var(--ext); } .key i.data { background: var(--data-soft); border-color: var(--data); }
svg text { font-family: var(--body); }
svg .t { fill: var(--fg); } svg .m { fill: var(--muted); }
svg .ai { fill: var(--ai-soft); stroke: var(--ai); } svg .code { fill: var(--code-soft); stroke: var(--code); }
svg .ext { fill: var(--ext-soft); stroke: var(--ext); } svg .data { fill: var(--data-soft); stroke: var(--data); }
svg .frame { fill: var(--sunk); stroke: var(--line); }
svg .arrow { stroke: var(--muted); fill: none; stroke-width: 1.8; } svg .arrowhead { fill: var(--muted); }
svg .badge-ai { fill: var(--ai); } svg .badge-code { fill: var(--code); } svg .badge-t { fill: var(--surface); }
svg .grp { fill: none; stroke: var(--line); stroke-dasharray: 6 4; } svg .grpt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
svg .lbl2 { font-size: 12.5px; font-weight: 700; } svg .sm { font-size: 10.5px; }
svg .nd { cursor: pointer; } svg .nd rect { stroke-width: 1.6; transition: stroke-width .15s; }
svg .nd:hover rect, svg .nd.on rect, svg .nd:focus-visible rect { stroke-width: 3.2; } svg .nd:focus { outline: none; }
svg .zoom { fill: var(--accent); font-size: 11px; font-weight: 700; opacity: 0; transition: opacity .15s; }
svg .nd:hover .zoom, svg .nd:focus-visible .zoom { opacity: 1; }

/* node detail */
.detail { padding: 22px 24px 26px; }
.dt-head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.dt-actions { display: flex; gap: 10px; align-items: center; } .dt-actions .cbtn { position: static; }
.dt-head h2 { font: 800 28px/1.15 var(--display); margin: 6px 0 8px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.bdg { font: 600 11.5px var(--mono); padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); }
.bdg b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.bdg.ai { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); } .bdg.code { border-color: var(--code); background: var(--code-soft); color: var(--code); }
.bdg.ext { border-color: var(--ext); background: var(--ext-soft); color: var(--ext); } .bdg.data { border-color: var(--data); background: var(--data-soft); color: var(--data); }
.one { font-size: 18px; max-width: 74ch; margin: 8px 0 18px; }
.io { display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1fr) minmax(170px, 230px); gap: 12px; align-items: start; }
.io.noports { grid-template-columns: minmax(0, 1fr); }
.port { border: 1.5px solid var(--data); background: var(--data-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; min-width: 0; }
.port h4 { margin: 0 0 6px; font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--data); }
.port ul { margin: 0 0 8px; padding-left: 16px; } .port li { margin: 2px 0; }
.port .meta { border-top: 1px dashed var(--data); padding-top: 6px; margin-top: 6px; color: var(--muted); font-size: 13px; } .port .meta b { color: var(--fg); }
.inside { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); min-width: 0; }
.inside .cap { font: 600 13px var(--body); color: var(--muted); margin-bottom: 8px; }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.node { flex: 1 1 120px; min-width: 0; max-width: 220px; text-align: left; border: 1.5px solid; border-radius: 10px; padding: 8px 10px; background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; align-self: stretch; }
.node b { display: block; font: 700 14.5px/1.25 var(--display); } .node small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.node.ai { background: var(--ai-soft); border-color: var(--ai); } .node.code { background: var(--code-soft); border-color: var(--code); }
.node.ext { background: var(--ext-soft); border-color: var(--ext); } .node.data { background: var(--data-soft); border-color: var(--data); }
.node[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); } .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sep { color: var(--muted); font-weight: 700; flex: 0 0 auto; }
.note { margin-top: 12px; background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-size: 15.5px; }
.note b { font-family: var(--display); } .note .go { margin-top: 10px; border-color: var(--accent); color: var(--accent); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 14px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; flex-wrap: wrap; scroll-margin-bottom: 80px; }
.btn { font: 600 14.5px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 8px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); } .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.ghost { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 4px 8px; }

/* machine */
.machine { display: grid; gap: 10px; }
.mgrid { display: grid; gap: 8px; }
.mstate { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: 14px; cursor: pointer; text-align: left; }
.mstate b { display: block; font: 700 14px var(--display); } .mstate.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.marrows { font-size: 13.5px; color: var(--muted); } .marrows li.on { color: var(--fg); font-weight: 600; }

/* calls */
.calls { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; font: 12.5px/1.6 var(--mono); margin-top: 6px; }
.cl-head { display: flex; gap: 14px; align-items: center; padding: 7px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); font: 600 12px var(--body); color: var(--muted); flex-wrap: wrap; }
.cl-head .k { display: inline-flex; gap: 6px; align-items: center; } .cl-head .k i { font: 700 11px var(--mono); width: 18px; text-align: center; border-radius: 4px; }
.cl-rows { padding: 6px 0; overflow-x: auto; }
.cl-row { display: flex; align-items: baseline; padding: 1px 12px 1px 0; white-space: nowrap; min-height: 22px; }
.cl-row:hover { filter: brightness(.97); }
.cl-rail { width: 28px; flex: 0 0 28px; text-align: center; color: var(--muted); font-weight: 700; cursor: pointer; border-radius: 4px; }
.cl-rail:hover { background: var(--sunk); }
.cl-rail:empty:hover::before { content: '×'; }
.cl-rows.norail .cl-rail { width: 14px; flex-basis: 14px; }
.cl-tg { color: var(--line); white-space: pre; }
.cl-nm { color: var(--fg); } .cl-note { color: var(--muted); font-family: var(--body); font-size: 13px; margin-left: 14px; }
.cl-loc { margin-left: auto; padding-left: 18px; color: var(--ext); font-size: 12px; flex: 0 0 auto; }
.cl-row.m-add { background: var(--code-soft); } .cl-row.m-add .cl-rail { color: var(--code); } .cl-row.m-add .cl-nm { font-weight: 700; }
.cl-row.m-mod { background: var(--warn-soft); } .cl-row.m-mod .cl-rail { color: var(--warn); } .cl-row.m-mod .cl-nm { font-weight: 700; }
.cl-row.m-ai { background: var(--ai-soft); } .cl-row.m-ai .cl-rail { color: var(--ai); }
.cl-row.struck .cl-nm, .cl-row.struck .cl-note { text-decoration: line-through; color: var(--muted); }
.cl-row.struck { background: var(--sunk); opacity: .7; }

/* decisions */
.dec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 12px; position: relative; }
.dec h3 { margin: 0 0 8px; font-size: 16.5px; }
.ctx { font-size: 14.5px; margin: 0 0 6px; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; font: 600 14.5px var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.opt:hover, .opt:focus-visible { border-color: var(--accent); outline: none; }
.opt[aria-expanded="true"] { border-color: var(--accent); }
.opt .pick { color: var(--code); }
.opt .pick { float: right; font: 600 11px var(--mono); }
.optd { display: none; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; margin-top: -8px; padding: 12px 14px 10px; background: var(--bg); font-size: 14px; }
.optd.show { display: block; }
.optd dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.optd dt { font: 600 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 2px; } .optd dd { margin: 0; }
.optd .choose { margin-top: 10px; } .optd .choose:hover { border-color: var(--code); color: var(--code); }
.openhead { margin-top: 26px; font-size: 18px; } .openhead:first-child { margin-top: 0; }
.dec > h3 { padding-right: 96px; }

/* comments and respond */
.cbtn { position: absolute; top: 12px; right: 12px; font: 600 12px var(--body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 99px; padding: 3px 9px; cursor: pointer; opacity: .7; }
.cbtn:hover, .cbtn.has { opacity: 1; color: var(--accent); border-color: var(--line); }
.cbox { margin-top: 10px; } .cbox label { display: block; font: 600 13px var(--body); color: var(--muted); } .cbox textarea { margin-top: 4px; }
.cbox textarea { width: 100%; min-height: 60px; font: 14px var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); resize: vertical; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; justify-content: flex-end; padding: 10px 18px; background: var(--surface); border-top: 1px solid var(--line); z-index: 5; font-size: 14px; color: var(--muted); }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 6; }
.sheet.show { display: block; }
.sheet .pane { position: absolute; right: 0; top: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); border-left: 1px solid var(--line); padding: 20px 22px; overflow: auto; }
.sheet h2 { margin: 0 0 10px; font: 800 22px var(--display); }
.sheet textarea { width: 100%; min-height: 280px; font: 12.5px/1.5 var(--mono); padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.sheet .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.fade { animation: fade .25s ease both; } @keyframes fade { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
@media (max-width: 860px) {
  .ov::after, .diag::after { display: block; }
  .io { grid-template-columns: minmax(0, 1fr); } .grid2 { grid-template-columns: minmax(0, 1fr); }
  .card > h3, .dec > h3 { padding-right: 0; padding-top: 26px; }
  .detail { padding: 18px 16px 22px; } .node { max-width: none; } .optd dl { grid-template-columns: 1fr; }
}

</style>

<script id="plan">

lections\nApply behavior remains open"},{"part":"Selected query","x":355,"y":35,"w":270,"h":82,"cls":"data","sub":"Required columns and predicates\nRelevant dataset / version"},{"part":"Applied result","x":695,"y":35,"w":285,"h":82,"cls":"data","sub":"Compact result cache\nBounded donor frame"},{"part":"Style edit","x":20,"y":245,"w":265,"h":82,"cls":"code","sub":"Colors · fonts · order\nFragment or dialog"},{"part":"Existing plot data","x":355,"y":245,"w":270,"h":82,"cls":"data","sub":"No Drive read\nNo new statistical test"},{"part":"Preview & export","x":695,"y":245,"w":285,"h":82,"cls":"code","sub":"Same applied context\nExisting figure-export tools"},{"part":"Storage & bounds","x":20,"y":385,"w":960,"h":78,"cls":"data","sub":"Parquet on disk · integrity-checked lazy Drive · serial statistics · bounded memory"}],"svg":"\u003cpath d=\"M285 76 H353\" class=\"arrow\" marker-end=\"url(#ah)\"/>\n\u003cpath d=\"M625 76 H693\" class=\"arrow\" marker-end=\"url(#ah)\"/>\n\u003cpath d=\"M285 286 H353\" class=\"arrow\" marker-end=\"url(#ah)\"/>\n\u003cpath d=\"M625 286 H693\" class=\"arrow\" marker-end=\"url(#ah)\"/>\n\u003cpath d=\"M838 117 V243\" class=\"arrow\" marker-end=\"url(#ah)\" stroke-dasharray=\"4 4\"/>\n\u003ctext x=\"855\" y=\"184\" class=\"m\" font-size=\"12\">reuse\u003c/text>\n\u003ctext x=\"20\" y=\"190\" class=\"t\" font-size=\"13\">Separate a change to the analysis from a change to its appearance\u003c/text>\n"},"notes":{"Analysis choices":"The recommended form batches expensive query choices. Dependency edits read lightweight metadata only. Pending edits leave the applied results and export labels unchanged until Apply.","Selected query":"Only the selected route and active subview execute their data path. KEGG, composition, and catalog-only views have no hidden donor-score request. Prediction bundle changes cannot invalidate unrelated datasets.","Applied result":"Cache compact results, not all raw donor frames. Keep donor frames bounded to the current plot or explicit query scope.","Style edit":"Use native fragments or dialogs for appearance edits. A color, font, or order change does not require a fresh query.","Existing plot data":"This path reads the data already held for the applied view. It does not fetch Drive data or recompute statistics.","Preview & export":"Reuse the figure-export preview, dimensions, fonts, colors, PNG, PDF, and vector tools with the applied result context.","Storage & bounds":"Keep schemas and files as they are. Reuse the local Parquet cache and integrity-checked lazy Drive access. Keep existing serial statistics and small caches; do not add a custom queue, daemon, or session manager."},"example":"Publication export · A color edit follows the lower path. An explicit all-module calculation follows the upper path and runs in series.","exampleLabel":"Publication export · data path"}}},{"kind":"decisions","settled":[{"decision":"Start with module discovery, then inspection.","from":"The researcher chooses a find-modules-first workflow.","considered":"Module finder first versus a plot-first entry screen."},{"decision":"Use simple defaults and retain all advanced tools.","from":"The researcher wants less clutter without feature loss.","considered":"Contextual disclosures versus all controls visible or tool removal."},{"decision":"Stay with Streamlit and Community Cloud.","from":"The researcher keeps the current platform and host.","considered":"Native Streamlit controls versus a new frontend or backend."},{"decision":"Use six task workspaces.","from":"The researcher selects the first navigation option to reduce page clutter and repeated context.","considered":"Consolidated task workspaces versus six groups of the familiar pages."},{"decision":"Apply analysis changes; show style changes at once.","from":"The researcher selects the first update option to avoid repeated reads during analysis setup.","considered":"Page-local Apply forms and data-free style edits versus an automatic query after eac <script>
/* visual-plan runtime. Renders window.PLAN: opening, examples, blocks (core and extras), the map as a node
   tree of depth 3 with zoom, decisions with option panels, comments, and the Respond sheet. No dependencies. */
(function () {
  'use strict';
  var P = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text || cls) + '</span>'; }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  var store = { picks: {}, comments: {}, struck: {} };
  function save() { try { localStorage.setItem('visual-plan:' + P.title, JSON.stringify(store)); } catch (e) {} }

  /* ---------- blocks ---------- */
  var KIND_TITLES = { problem: 'Problem, and how it works today', design: 'Design reference', map: 'Map', terms: 'Terms', traces: 'Traces', constraints: 'Constraints', data: 'Data models', decisions: 'Decisions', risks: 'Risks, and what changes for a reader', goal: 'Goal', scope: 'Scope', reused: 'Reused', section: '' };
  var TOC_TITLES = { problem: 'Problem', design: 'Design', map: 'Map', terms: 'Terms', traces: 'Traces', constraints: 'Constraints', data: 'Data models', decisions: 'Decisions', risks: 'Risks', goal: 'Goal', scope: 'Scope', reused: 'Reused' };

  function commentBtn(key, label) {
    var has = store.comments[key] ? ' has' : '';
    return '<button type="button" class="cbtn' + has + '" data-c="' + esc(key) + '" data-label="' + esc(label || key) + '" title="Comment on this part">' + (has ? 'comment ✓' : 'comment') + '</button>';
  }
  function card(key, inner, label) { return '<div class="card">' + commentBtn(key, label || strip(inner).slice(0, 60)) + inner + '</div>'; }
  function strip(h) { var t = document.createElement('div'); t.innerHTML = h; return (t.textContent || '').replace(/\s+/g, ' ').trim(); }
  function list(items) { return '<ul>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'; }

  function renderBlock(b, i) {
    var id = b.id || b.kind + (b.kind === 'section' ? i : '');
    var title = b.title || KIND_TITLES[b.kind] || '';
    var h = '<section class="block" id="' + esc(id) + '">' + (title ? '<h2 class="sec">' + title + '</h2>' : '') + (b.sub ? '<p class="sub">' + b.sub + '</p>' : '');
    switch (b.kind) {
      case 'problem':
        h += '<div class="grid2">' + card(id + '/problem', '<h3>Problem</h3><p>' + b.problem + '</p>') +
             card(id + '/today', '<h3>' + esc(b.today.label || 'How it works today') + '</h3>' + list(b.today.items)) + '</div>';
        break;
      case 'map':
        h += '<div class="crumbs" id="crumbs"></div><div class="stage"><div id="overview"><div class="ov" data-scroll="scroll sideways →"></div><div class="hint">' +
             (b.legend || []).map(function (k) { return '<span class="key"><i class="' + esc(k[0]) + '"></i>' + esc(k[1]) + '</span>'; }).join('') +
             (b.note ? '<span>' + b.note + '</span>' : '') + '</div></div><div class="detail" id="detail" hidden></div></div>' +
             (b.walkthrough ? '<p class="sub" style="margin-top:10px"><b>In two lines:</b> ' + b.walkthrough + '</p>' : '');
        break;
      case 'terms':
        h += '<div class="termflow">' + (b.cards || []).map(function (c, j) {
          return (j ? '<span class="sep" aria-hidden="true">→</span>' : '') + '<div class="tcard">' + commentBtn(id + '/term/' + j, c.term) + '<span class="term ' + esc(c.cls || 'car') + '">' + esc(c.term) + '</span><b class="tt">' + c.title + '</b><p>' + c.text + '</p>' + (c.example ? '<p class="ex">' + c.example + '</p>' : '') + '</div>';
        }).join('') + '</div>';

    if (cs.length) {
      out.push('## Comments');
      cs.forEach(function (k) { var b = document.querySelector('[data-c="' + k.replace(/"/g, '\\"') + '"]'); out.push('- **' + (b ? b.getAttribute('data-label') : k) + '**'); store.comments[k].split('\n').forEach(function (l) { out.push('  > ' + l); }); });
      out.push('');
    }
    var left = openDecs.filter(function (d) { return store.picks[d.id] == null; }).length;
    if (!decBlock) return out.join('\n').replace(/\n+$/, '');
    out.push('## Lock'); out.push(lock ? 'locked' : (openDecs.length ? (left ? 'not yet: ' + left + ' decision(s) not answered' : 'ready: all decisions answered; move them to the settled table and offer the lock') : 'not locked'));
    return out.join('\n');
  }
  function openSheet(lock) {
    var sheet = document.getElementById('sheet'); sheet.classList.add('show');
    var ta = sheet.querySelector('textarea'); ta.value = responseMarkdown(lock); document.getElementById('copied').textContent = '';
  }

  /* ---------- page ---------- */
  function render() {
    // A host that wraps the page in its own document (the claude.ai Artifact tool) leaves the page's <style>,
    // <title> and <meta> in its <body>; move them to <head> before the body is replaced, or the page loses its CSS.
    document.body.querySelectorAll('style, title, meta').forEach(function (el) { document.head.appendChild(el); });
    P = window.PLAN;
    if (!P) { document.body.innerHTML = '<p style="padding:24px">No plan data: window.PLAN is missing.</p>'; return; }
    init();
    var h = '<div class="wrap"><h1>' + esc(P.title) + (P.status ? (openDecs.length ? '<a class="tag ' + esc(P.status.badge) + '" href="#decisions">' + esc(P.status.text) + '</a>' : tag(P.status.badge, P.status.text)) : '') + '</h1>';
    if (P.opening) h += '<p class="opening">' + P.opening + '</p>';
    if (P.examples && P.examples.length) h += '<div class="exstrip" role="note"><b>Examples on this page.</b> ' + (P.examplesNote || '') + P.examples.map(function (e) { return '<span class="exb"><b>' + esc(e.name) + '</b>' + e.text + '</span>'; }).join('') + '</div>';
    h += '<nav class="toc" aria-label="Sections">' + P.blocks.map(function (b, i) { var id = b.id || b.kind + (b.kind === 'section' ? i : ''); var label = b.title && b.kind === 'section' ? b.title : (TOC_TITLES[b.kind] || b.title || b.kind); if (b.kind === 'decisions' && openDecs.length) label += ' · ' + openDecs.length + ' open'; return '<a href="#' + esc(id) + '">' + esc(label) + '</a>'; }).join('') + '</nav>';
    h += P.blocks.map(renderBlock).join('');
    h += '</div>';
    h += '<div class="bar" id="bar"><span class="state"></span><button type="button" class="btn" id="respond">Respond</button>' + (openDecs.length || !decBlock ? '' : '<button type="button" class="btn pri" id="lock">Lock this design</button>') + '</div>';
    h += '<div class="sheet" id="sheet"><div class="pane"><h2>Your response</h2><p class="sub">Copy this text and paste it in the chat. Your answers and struck rows are decisions; your comments are feedback.</p><textarea readonly aria-label="Your response, as text to paste in the chat"></textarea><div class="row"><button type="button" class="btn pri" id="copy">Copy response</button><button type="button" class="btn" id="close">Close</button><span class="sub" id="copied"></span></div></div></div>';
    document.body.innerHTML = h;
    renderMap();
    bindComments(document); bindCalls(document); bindDecisions(document); bindGo(document);
    document.getElementById('respond').onclick = function () { openSheet(false); };
    var lockBtn = document.getElementById('lock'); if (lockBtn) lockBtn.onclick = function () { openSheet(true); };
    document.getElementById('close').onclick = function () { document.getElementById('sheet').classList.remove('show'); };
    document.getElementById('copy').onclick = function () {
      var ta = document.querySelector('#sheet textarea'); ta.select();
      var done = function () { document.getElementById('copied').textContent = 'copied'; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); }
    };
    updateBar();
    var start = (location.hash || '').slice(1);
    if (N[start] && start !== (mapBlock && mapBlock.root)) openDirect(start);
    window.addEventListener('hashchange', function () { var id = (location.hash || '').slice(1); if (N[id] && id !== mapBlock.root) openDirect(id); else if (!id && current) goHome(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
})();

</script>
