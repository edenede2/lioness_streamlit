name: Inspect paper figure functions

on:
  push:
    branches: [temp-paper-figure-export]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      - name: Inspect prediction plotting functions
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          from app_helpers import charts
          names = ['prediction_curve_figure','prediction_performance_figure']
          out=[]
          for name in names:
              fn=getattr(charts,name)
              out.append(f'### {name}\nSIGNATURE: {inspect.signature(fn)}\n\n{inspect.getsource(fn)}\n')
          Path('prediction_figure_functions.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-figure-functions
          path: prediction_figure_functions.txt
