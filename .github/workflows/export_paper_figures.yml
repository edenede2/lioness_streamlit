name: Export paper figures from app plots

on:
  push:
    branches: [temp-paper-figure-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet kaleido==0.2.1
      - name: Export figures using app plotting functions
        run: PYTHONPATH=. python scripts/export_paper_figures_from_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-figures-from-streamlit
          path: paper_figures/
