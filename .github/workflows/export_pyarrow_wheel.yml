name: Export pyarrow wheel

on:
  push:
    branches:
      - temp-paper-figure-export

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download wheel
        run: python -m pip download --only-binary=:all: --no-deps pyarrow==22.0.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: pyarrow-cp313-wheel
          path: wheels/*.whl
